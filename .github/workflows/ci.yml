name: CI

on:
  push:
  pull_request:

jobs:
  build-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: |
          ./build/bench/olv_bench --benchmark_min_time=0.2s | tee bench.txt
          {
            echo '## Benchmark'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CLI smoke run
        run: ./build/olv tests/data/sample_orderlog.csv 0.01
